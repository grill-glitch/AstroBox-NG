name: Build AstroBox-NG

on:
  push:
    branches: [main, master, neo, v3]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.90"
  CARGO_TERM_COLOR: always

jobs:
  # ── 1. Pull public submodules + check compilation ────────────────
  build-rust:
    name: Build Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          sharedKey: ${{ runner.os }}-rust

      # ── Pull all public submodules ────────────────────────────────
      - name: Pull public submodules
        env:
          GH_TOKEN: *** secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ROOT="$(pwd)"

          clone_mod() {
            local path="$1" url="$2"
            if [ -f "$path/Cargo.toml" ]; then
              echo "✓ $path already present"
              return
            fi
            echo "→ $path ← $url"
            mkdir -p "$(dirname "$path")"
            git clone --depth 1 "$url" "$path" 2>&1 || echo "⚠ clone failed: $path"
          }

          # Public Rust modules
          clone_mod "src-tauri/modules/app_esp32s3"   "https://github.com/AstralSightStudios/AstroBox-NG-Module-App-ESP32S3.git"
          clone_mod "src-tauri/modules/app_wasm"       "https://github.com/AstralSightStudios/AstroBox-NG-Module-AppWasm.git"
          clone_mod "src-tauri/modules/bluetooth"      "https://github.com/AstralSightStudios/AstroBox-NG-Module-Bluetooth.git"
          clone_mod "src-tauri/modules/core"           "https://github.com/AstralSightStudios/AstroBox-NG-Module-Core.git"
          clone_mod "src-tauri/modules/frontbridge"    "https://github.com/AstralSightStudios/AstroBox-NG-Module-FrontBridge.git"
          clone_mod "src-tauri/modules/pb"             "https://github.com/AstralSightStudios/AstroBox-NG-Module-Pb.git"
          clone_mod "src-tauri/modules/pluginsystem"   "https://github.com/AstralSightStudios/AstroBox-NG-Module-PluginSystem.git"
          clone_mod "src-tauri/modules/provider"       "https://github.com/AstralSightStudios/AstroBox-NG-Module-Provider.git"
          clone_mod "src-tauri/modules/vivo_msgpack"   "https://github.com/AstralSightStudios/AstroBox-NG-Module-Vivo-MsgPack.git"

          # WIT interface files
          clone_mod "src-tauri/modules/pluginsystem/wit" "https://github.com/AstralSightStudios/AstroBox-Plugin-WIT.git"

          # Public Tauri plugins
          clone_mod "src-tauri/plugins/btclassic-spp"  "https://github.com/AstralSightStudios/AstroBox-NG-Plugin-BtClassicSpp.git"
          clone_mod "src-tauri/plugins/live-activity"   "https://github.com/AstralSightStudios/AstroBox-NG-Plugin-LiveActivity.git"
          clone_mod "src-tauri/plugins/android-widgets" "https://github.com/AstralSightStudios/AstroBox-NG-Plugin-AndroidWidgets.git"

          echo ""
          echo "=== modules ==="
          ls src-tauri/modules/
          echo "=== plugins ==="
          ls src-tauri/plugins/

      # ── Patch Cargo.toml: remove private members, add wasm ────────
      - name: Patch workspace Cargo.toml
        run: |
          cd src-tauri
          # Remove private module entries from workspace members
          # Keep only public modules + wasm + plugins
          cat > Cargo.toml << 'TOMLEOF'
          [workspace]
          members = [
              "modules/app_wasm",
              "modules/bluetooth",
              "modules/core",
              "modules/frontbridge",
              "modules/pb",
              "modules/pluginsystem",
              "modules/provider",
              "modules/vivo_msgpack",
              "plugins/android-widgets",
              "plugins/btclassic-spp",
              "plugins/live-activity",
          ]
          exclude = [
              "modules/app_esp32s3",
          ]
          resolver = "3"

          [patch.crates-io]
          rustix = { git = "https://github.com/66hh/rustix-android-patch", branch = "main" }
          TOMLEOF
          echo "=== Patched Cargo.toml ==="
          cat Cargo.toml

      - name: Check compilation (cargo check)
        run: cargo check --manifest-path src-tauri/Cargo.toml --workspace

      - name: Run tests (corelib)
        run: cargo test -p corelib --manifest-path src-tauri/Cargo.toml
        continue-on-error: true

      - name: Build release (wasm module)
        run: cargo build -p astrobox-ng-wasm --manifest-path src-tauri/Cargo.toml --release
        continue-on-error: true

  # ── 2. Frontend build (placeholder – WebUI is private) ──────────
  build-frontend:
    name: Build Frontend (placeholder)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Note about private WebUI
        run: |
          echo "⚠ The web frontend (AstroBox-NG-WebUI) is a private submodule."
          echo "  Skipping rsbuild. To enable full Tauri builds, grant access"
          echo "  to the private repo or make it public."
